name: Deploy console to GitHub Pages

# Builds the static export and publishes it. Pages must be set to build from
# "GitHub Actions" (Settings -> Pages -> Source), not from a branch.
# Manual only, for now. Until the Supabase anon key exists this workflow
# cannot succeed, and firing it on every push would paint the repo red and
# bury genuine failures. Switch back to `push` once the key is set.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue instead of cancelling, so a push that
# lands mid-deploy still ships rather than being silently dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Check BEFORE building, not after. A missing secret does not become the
      # placeholder string — it becomes an empty string, which compiles happily
      # and then throws in the visitor's browser on the first Supabase call.
      # The after-the-fact placeholder check below cannot see that case.
      - name: Require real Supabase credentials
        env:
          SUPA_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPA_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          [ -n "$SUPA_URL" ] || { echo "::error::Repository secret NEXT_PUBLIC_SUPABASE_URL is not set."; exit 1; }
          [ -n "$SUPA_KEY" ] || { echo "::error::Repository secret NEXT_PUBLIC_SUPABASE_ANON_KEY is not set."; exit 1; }
          # Two shapes are valid. `eyJ...` is the legacy JWT anon key; Supabase
          # now issues `sb_publishable_...` instead and calls the old one
          # compatibility-only. Accepting only the legacy shape would reject the
          # key this project actually uses.
          case "$SUPA_KEY" in
            eyJ*|sb_publishable_*) ;;
            *) echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY does not look like a Supabase publishable/anon key (expected eyJ... or sb_publishable_...)."; exit 1 ;;
          esac

      - run: npm run build
        env:
          # The console is served at admin.gopicadera.com, a domain root, so
          # nothing should be prefixed with the repo name.
          NEXT_BASE_PATH: ""

          # NEXT_PUBLIC_* values are compiled into the JavaScript at build time,
          # not read at runtime — which is why they belong here and not in some
          # runtime config. The anon key is public by design; Row Level Security
          # is what actually decides what it can touch.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Fail loudly rather than shipping a console that cannot reach Supabase.
      - name: Check the build picked up a real key
        run: |
          if grep -rq "placeholder-anon-key" out/_next/static/chunks/ 2>/dev/null; then
            echo "::error::Built with the placeholder anon key. Set the NEXT_PUBLIC_SUPABASE_ANON_KEY repository secret."
            exit 1
          fi
          test -f out/.nojekyll || { echo "::error::out/.nojekyll missing — Jekyll will strip the _next directory."; exit 1; }

      # deploy-pages replaces the whole site each run, so the custom domain has
      # to ship inside the artifact or Pages forgets it and reverts to
      # cryptofedge.github.io/gopicadera-console.
      - name: Keep the custom domain
        run: echo "admin.gopicadera.com" > out/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
