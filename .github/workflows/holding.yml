name: Publish the holding page

# Publishes holding/ to the console URL. For showing the client progress before
# the Supabase key exists — the real deploy.yml refuses to build without it.
#
# Both workflows publish to the same Pages site, so whichever ran last is what
# is live. Running deploy.yml successfully replaces this page with the console.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: holding
      - id: deployment
        uses: actions/deploy-pages@v4
